<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Route Zeichnen</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: #000;
        }

        #map { flex: 1; }

        #controls {
            background: #1c1c1e;
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 60px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
            white-space: nowrap;
        }
        button:active { opacity: 0.7; transform: scale(0.97); }

        #drawBtn { background: #007AFF; color: white; }
        #drawBtn.active { background: #FF3B30; }
        #pinBtn { background: #FF9500; color: white; }
        #pinBtn.active { background: #c07000; }
        #shortestBtn { background: #AF52DE; color: white; }
        #clearBtn { background: #3a3a3c; color: white; }

        #status {
            flex: 1;
            text-align: center;
            font-size: 13px;
            color: #aeaeb2;
            line-height: 1.3;
        }

        /* Verhindert blaues Highlight beim Zeichnen auf Touch */
        #map * { -webkit-tap-highlight-color: transparent; }

        .drawing-cursor { cursor: crosshair !important; }
        .pin-cursor { cursor: cell !important; }

        #scalebar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(0,0,0,0.45);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            padding: 3px 0;
            letter-spacing: 0.5px;
            pointer-events: none;
        }

        /* Fixpunkt-Marker */
        .fixed-pin {
            background: #FF9500;
            color: white;
            border: 2.5px solid white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0,0,0,0.55);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="map">
        <div id="scalebar"></div>
    </div>
    <div id="controls">
        <button id="drawBtn" onclick="toggleDraw()">✏️ Zeichnen</button>
        <button id="pinBtn" onclick="togglePinMode()">📍 Fixpunkt</button>
        <button id="shortestBtn" onclick="routeShortestThroughPins()">🗺 Kürzeste</button>
        <span id="status">Route auf der Karte einzeichnen</span>
        <button id="replayRouteBtn" onclick="replayRoute()" style="display:none;background:#636366;color:white" title="Letzte Route wiederherstellen">↺ Route</button>
        <button id="replayPinsBtn" onclick="replayPins()" style="display:none;background:#7a4800;color:white" title="Letzte Fixpunkte wiederherstellen">↺ ★</button>
        <button onclick="clearRoute()" style="background:#3a3a3c;color:white" title="Route löschen">✕ Route</button>
        <button onclick="clearPins()" style="background:#3a3a3c;color:white" title="Fixpunkte löschen">✕ ★</button>
    </div>

    <script>
        // Karte initialisieren
        const map = L.map('map', {
            zoomControl: true,
            tap: false // wichtig für Touch-Zeichnen
        }).setView([48.153, 11.525], 16);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
            maxZoom: 19
        }).addTo(map);

        // Entfernungsanzeige für die volle Fensterbreite
        const scaleBar = document.getElementById('scalebar');
        function updateScalebar() {
            const lat = map.getCenter().lat;
            const mapWidthPx = map.getSize().x;
            const metersPerPx = 156543.03 * Math.cos(lat * Math.PI / 180) / Math.pow(2, map.getZoom());
            const totalMeters = metersPerPx * mapWidthPx;
            const label = totalMeters >= 1000
                ? (totalMeters / 1000).toFixed(totalMeters < 10000 ? 1 : 0) + ' km'
                : Math.round(totalMeters) + ' m';
            scaleBar.textContent = '|← ' + label + ' →|';
        }
        map.on('zoomend moveend', updateScalebar);
        updateScalebar();

        // ---- State ----
        let isDrawing = false;
        let isPinMode = false;
        let isPointerDown = false;
        let drawnPoints = [];
        let drawnPolyline = null;
        let matchedPolyline = null;
        let lastAddedPoint = null;
        let fixedWaypoints = []; // Array von {latlng, marker}

        // ---- UI ----
        function setStatus(msg) {
            document.getElementById('status').textContent = msg;
        }

        // ---- Zeichnen ----
        function toggleDraw() {
            // Pin-Modus beenden falls aktiv
            if (isPinMode) {
                isPinMode = false;
                document.getElementById('pinBtn').textContent = '📍 Fixpunkt';
                document.getElementById('pinBtn').classList.remove('active');
                map.getContainer().classList.remove('pin-cursor');
            }

            isDrawing = !isDrawing;
            const btn = document.getElementById('drawBtn');

            if (isDrawing) {
                btn.textContent = '⏹ Fertig';
                btn.classList.add('active');
                map.dragging.disable();
                map.scrollWheelZoom.disable();
                map.getContainer().classList.add('drawing-cursor');
                setStatus('Finger/Maus gedrückt halten und Route zeichnen…');
            } else {
                btn.textContent = '✏️ Zeichnen';
                btn.classList.remove('active');
                map.dragging.enable();
                map.scrollWheelZoom.enable();
                map.getContainer().classList.remove('drawing-cursor');

                if (drawnPoints.length >= 2) {
                    matchRoute();
                } else {
                    setStatus('Zu wenige Punkte – bitte nochmal zeichnen.');
                }
            }
        }

        // ---- Fixpunkt-Modus ----
        function togglePinMode() {
            // Zeichnen beenden falls aktiv
            if (isDrawing) {
                isDrawing = false;
                const drawBtn = document.getElementById('drawBtn');
                drawBtn.textContent = '✏️ Zeichnen';
                drawBtn.classList.remove('active');
                map.dragging.enable();
                map.scrollWheelZoom.enable();
                map.getContainer().classList.remove('drawing-cursor');
            }

            isPinMode = !isPinMode;
            const btn = document.getElementById('pinBtn');

            if (isPinMode) {
                btn.textContent = '📍 Fertig';
                btn.classList.add('active');
                map.getContainer().classList.add('pin-cursor');
                setStatus('Auf Karte tippen = Fixpunkt setzen · Auf ★ tippen = entfernen');
            } else {
                btn.textContent = '📍 Fixpunkt';
                btn.classList.remove('active');
                map.getContainer().classList.remove('pin-cursor');
                // Route neu berechnen wenn Punkte gezeichnet sind
                if (drawnPoints.length >= 2) {
                    matchRoute();
                } else {
                    updatePinStatus();
                }
            }
        }

        // Karte-Klick: Fixpunkt setzen (nur im Pin-Modus)
        map.on('click', (e) => {
            if (!isPinMode) return;
            addFixedWaypoint(e.latlng);
        });

        function createPinIcon(number) {
            return L.divIcon({
                className: '',
                html: `<div class="fixed-pin">${number}</div>`,
                iconSize: [28, 28],
                iconAnchor: [14, 28]
            });
        }

        function refreshPinNumbers() {
            fixedWaypoints.forEach((wp, i) => wp.marker.setIcon(createPinIcon(i + 1)));
        }

        function addFixedWaypoint(latlng, recalculate = true) {
            const marker = L.marker(latlng, {
                icon: createPinIcon(fixedWaypoints.length + 1),
                zIndexOffset: 1000
            }).addTo(map);

            const wp = { latlng, marker };
            fixedWaypoints.push(wp);

            marker.on('click', (e) => {
                L.DomEvent.stopPropagation(e);
                removeFixedWaypoint(wp);
            });

            if (recalculate && drawnPoints.length >= 2 && !isDrawing && !isPinMode) {
                matchRoute();
            } else {
                updatePinStatus();
            }
        }

        function removeFixedWaypoint(wp) {
            map.removeLayer(wp.marker);
            fixedWaypoints = fixedWaypoints.filter(w => w !== wp);
            refreshPinNumbers();
            if (drawnPoints.length >= 2 && !isDrawing && !isPinMode) {
                matchRoute();
            } else {
                updatePinStatus();
            }
        }

        function updatePinStatus() {
            const n = fixedWaypoints.length;
            if (n === 0) {
                setStatus('Route auf der Karte einzeichnen');
            } else {
                setStatus(`${n} Fixpunkt${n > 1 ? 'e' : ''} gesetzt`
                    + (drawnPoints.length < 2 ? ' – jetzt Route zeichnen' : ''));
            }
        }

        // Fixpunkte in Waypoint-Liste einmergen, sortiert nach Position auf der Zeichnung
        // Gibt {mergedPts, fixedSet} zurück
        function mergeFixedPoints(pts) {
            if (fixedWaypoints.length === 0) return { mergedPts: pts, fixedSet: new Set() };

            // Fortschritt entlang der gezeichneten Linie (Index des nächsten drawnPoints)
            function progressOnLine(latlng) {
                let minDist = Infinity, bestIdx = 0;
                for (let i = 0; i < drawnPoints.length; i++) {
                    const d = haversine(latlng, drawnPoints[i]);
                    if (d < minDist) { minDist = d; bestIdx = i; }
                }
                return bestIdx;
            }

            // Alle Punkte mit Progress annotieren und sortieren
            const items = [
                ...pts.map(p => ({ latlng: p, progress: progressOnLine(p), isFixed: false })),
                ...fixedWaypoints.map(wp => ({ latlng: wp.latlng, progress: progressOnLine(wp.latlng), isFixed: true }))
            ].sort((a, b) => a.progress - b.progress);

            // Doppelte Punkte (< 30m) zusammenführen – Fixed hat Vorrang
            const deduped = [];
            for (const item of items) {
                const last = deduped[deduped.length - 1];
                if (last && haversine(last.latlng, item.latlng) < 30) {
                    if (item.isFixed) last.isFixed = true;
                } else {
                    deduped.push({ ...item });
                }
            }

            const mergedPts = deduped.map(d => d.latlng);
            const fixedSet = new Set(deduped.reduce((acc, d, i) => {
                if (d.isFixed) acc.push(i);
                return acc;
            }, []));
            return { mergedPts, fixedSet };
        }

        function clearRoute() {
            drawnPoints = [];
            lastAddedPoint = null;
            isPointerDown = false;

            if (drawnPolyline) { map.removeLayer(drawnPolyline); drawnPolyline = null; }
            if (matchedPolyline) { map.removeLayer(matchedPolyline); matchedPolyline = null; }

            if (isDrawing) {
                setStatus('Finger/Maus gedrückt halten und Route zeichnen…');
            } else {
                updatePinStatus();
            }
        }

        function clearPins() {
            fixedWaypoints.forEach(wp => map.removeLayer(wp.marker));
            fixedWaypoints = [];

            if (drawnPoints.length >= 2 && !isDrawing) {
                matchRoute();
            } else {
                updatePinStatus();
            }
        }

        // ---- Zeichnen Events ----
        const mapEl = map.getContainer();

        // Maus
        mapEl.addEventListener('mousedown', e => {
            if (!isDrawing) return;
            isPointerDown = true;
            lastAddedPoint = null;
            addPoint(clientToLatLng(e.clientX, e.clientY));
        });
        mapEl.addEventListener('mousemove', e => {
            if (!isDrawing || !isPointerDown) return;
            tryAddPoint(clientToLatLng(e.clientX, e.clientY));
        });
        mapEl.addEventListener('mouseup', () => { isPointerDown = false; });
        mapEl.addEventListener('mouseleave', () => { isPointerDown = false; });

        // Touch
        mapEl.addEventListener('touchstart', e => {
            if (!isDrawing) return;
            e.preventDefault();
            isPointerDown = true;
            lastAddedPoint = null;
            addPoint(clientToLatLng(e.touches[0].clientX, e.touches[0].clientY));
        }, { passive: false });

        mapEl.addEventListener('touchmove', e => {
            if (!isDrawing || !isPointerDown) return;
            e.preventDefault();
            tryAddPoint(clientToLatLng(e.touches[0].clientX, e.touches[0].clientY));
        }, { passive: false });

        mapEl.addEventListener('touchend', () => { isPointerDown = false; });

        function clientToLatLng(clientX, clientY) {
            const rect = mapEl.getBoundingClientRect();
            return map.containerPointToLatLng(L.point(clientX - rect.left, clientY - rect.top));
        }

        function tryAddPoint(latlng) {
            if (lastAddedPoint) {
                const p1 = map.latLngToContainerPoint(lastAddedPoint);
                const p2 = map.latLngToContainerPoint(latlng);
                if (p1.distanceTo(p2) < 12) return;
            }
            addPoint(latlng);
        }

        function addPoint(latlng) {
            drawnPoints.push(latlng);
            lastAddedPoint = latlng;

            if (drawnPolyline) {
                drawnPolyline.setLatLngs(drawnPoints);
            } else {
                drawnPolyline = L.polyline(drawnPoints, {
                    color: '#007AFF',
                    weight: 3,
                    opacity: 0.6,
                    dashArray: '8, 5'
                }).addTo(map);
            }
        }

        // ---- Replay ----
        function saveDrawnPoints() {
            localStorage.setItem('lastRoute', JSON.stringify(drawnPoints.map(p => [p.lat, p.lng])));
            document.getElementById('replayRouteBtn').style.display = '';
        }

        function saveFixedWaypoints() {
            localStorage.setItem('lastFixedWaypoints', JSON.stringify(fixedWaypoints.map(wp => [wp.latlng.lat, wp.latlng.lng])));
            document.getElementById('replayPinsBtn').style.display = '';
        }

        // Nur die gezeichnete Route wiederherstellen (Fixpunkte bleiben unverändert)
        function replayRoute() {
            const saved = localStorage.getItem('lastRoute');
            if (!saved) return;

            drawnPoints = [];
            if (drawnPolyline) { map.removeLayer(drawnPolyline); drawnPolyline = null; }
            if (matchedPolyline) { map.removeLayer(matchedPolyline); matchedPolyline = null; }

            drawnPoints = JSON.parse(saved).map(p => L.latLng(p[0], p[1]));
            drawnPolyline = L.polyline(drawnPoints, {
                color: '#007AFF', weight: 3, opacity: 0.6, dashArray: '8, 5'
            }).addTo(map);
            map.fitBounds(drawnPolyline.getBounds(), { padding: [40, 40] });
            matchRoute();
        }

        // Nur die Fixpunkte wiederherstellen (gezeichnete Route bleibt unverändert)
        function replayPins() {
            const savedFP = localStorage.getItem('lastFixedWaypoints');
            if (!savedFP) return;

            fixedWaypoints.forEach(wp => map.removeLayer(wp.marker));
            fixedWaypoints = [];

            JSON.parse(savedFP).forEach(p => addFixedWaypoint(L.latLng(p[0], p[1]), false));
            refreshPinNumbers();

            if (drawnPoints.length >= 2) {
                matchRoute();
            } else {
                updatePinStatus();
            }
        }

        if (localStorage.getItem('lastRoute')) {
            document.getElementById('replayRouteBtn').style.display = '';
        }
        if (localStorage.getItem('lastFixedWaypoints')) {
            document.getElementById('replayPinsBtn').style.display = '';
        }

        // ---- OSRM Route Matching ----
        async function matchRoute() {
            setStatus('⏳ Route wird auf Straßen angepasst…');

            // Bei Fixpunkten direkt Route-Endpoint nutzen (bessere Wegpunkt-Kontrolle)
            if (fixedWaypoints.length > 0) {
                await tryRouteEndpoint();
                return;
            }

            const matched = await tryMatchEndpoint();
            if (!matched) await tryRouteEndpoint();
        }

        async function tryMatchEndpoint() {
            const pts = samplePoints(drawnPoints, 50);
            const coords = pts.map(p => `${p.lng.toFixed(6)},${p.lat.toFixed(6)}`).join(';');
            const url = `https://router.project-osrm.org/match/v1/driving/${coords}`
                + `?overview=full&geometries=geojson&gaps=ignore`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                console.log('Match-Antwort:', data.code, data);

                if (data.code !== 'Ok' || !data.matchings?.length) return false;

                if (matchedPolyline) { map.removeLayer(matchedPolyline); matchedPolyline = null; }

                const allLatLngs = [];
                let totalDist = 0;
                for (const m of data.matchings) {
                    totalDist += m.distance;
                    for (const c of m.geometry.coordinates) allLatLngs.push([c[1], c[0]]);
                }

                matchedPolyline = L.polyline(allLatLngs, { color: '#34C759', weight: 5, opacity: 0.9 }).addTo(map);
                const km = (totalDist / 1000).toFixed(1);
                setStatus(`✅ ${km} km  (Map Matching)`);
                saveDrawnPoints();
                saveFixedWaypoints();
                return true;

            } catch (err) {
                console.warn('Match fehlgeschlagen:', err);
                return false;
            }
        }

        async function tryRouteEndpoint() {
            let pts = samplePointsByDistance(drawnPoints, 200);
            if (pts.length > 40) pts = samplePoints(pts, 40);

            // Fixpunkte in die Wegpunkt-Liste einmergen
            let { mergedPts, fixedSet } = mergeFixedPoints(pts);
            pts = mergedPts;

            try {
                for (let iter = 0; iter < 5; iter++) {
                    if (pts.length < 2) break;

                    const coords = pts.map(p => `${p.lng.toFixed(6)},${p.lat.toFixed(6)}`).join(';');
                    const url = `https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`;
                    const res = await fetch(url);
                    const data = await res.json();
                    console.log(`Route-Versuch ${iter + 1}:`, data.code, `${pts.length} Punkte`);

                    if (data.code !== 'Ok' || !data.routes?.length) {
                        setStatus(`❌ Fehler: ${data.code || 'Unbekannt'}`);
                        return;
                    }

                    const route = data.routes[0];
                    const routeCoords = route.geometry.coordinates.map(c => [c[1], c[0]]);
                    const toRemove = new Set();

                    // 1) U-Turns: Richtungsumkehr > 160°
                    for (const uIdx of findUturns(routeCoords)) {
                        const uCoord = routeCoords[uIdx];
                        let minDist = Infinity, closest = -1;
                        for (let i = 1; i < pts.length - 1; i++) {
                            if (fixedSet.has(i)) continue; // Fixpunkte nie entfernen
                            const d = (uCoord[0] - pts[i].lat) ** 2 + (uCoord[1] - pts[i].lng) ** 2;
                            if (d < minDist) { minDist = d; closest = i; }
                        }
                        if (closest > 0) toRemove.add(closest);
                    }

                    // 2a) Lokaler Detour: ein Wegpunkt verursacht > 3.5× Umweg
                    for (let i = 1; i < pts.length - 1; i++) {
                        if (fixedSet.has(i)) continue;
                        const legIn  = route.legs[i - 1].distance;
                        const legOut = route.legs[i].distance;
                        const direct = haversine(pts[i - 1], pts[i + 1]);
                        if (direct > 100 && (legIn + legOut) / direct > 3.5) {
                            console.log(`Lokaler Detour ${i}: ${((legIn+legOut)/direct).toFixed(1)}×`);
                            toRemove.add(i);
                        }
                    }

                    // 2b) Verteilter Detour: zwei benachbarte Punkte verursachen > 4× Umweg
                    for (let i = 1; i < pts.length - 2; i++) {
                        if (fixedSet.has(i) || fixedSet.has(i + 1)) continue;
                        const leg1 = route.legs[i - 1].distance;
                        const leg2 = route.legs[i].distance;
                        const leg3 = route.legs[i + 1].distance;
                        const direct = haversine(pts[i - 1], pts[i + 2]);
                        if (direct > 200 && (leg1 + leg2 + leg3) / direct > 4) {
                            console.log(`Verteilter Detour ${i}-${i+1}: ${((leg1+leg2+leg3)/direct).toFixed(1)}×`);
                            toRemove.add(i);
                            toRemove.add(i + 1);
                        }
                    }

                    // 2c) Adaptiver Snap-Filter: Einrast-Position zu weit von der Zeichnung entfernt
                    for (let i = 1; i < pts.length - 1; i++) {
                        if (fixedSet.has(i)) continue;
                        const loc = data.waypoints[i].location; // [lon, lat]
                        const snapDist = distToDrawnLine(loc[1], loc[0]);
                        const avgSeg = (haversine(pts[i - 1], pts[i]) + haversine(pts[i], pts[i + 1])) / 2;
                        const threshold = Math.min(3000, Math.max(300, avgSeg * 0.8));
                        if (snapDist > threshold) {
                            console.log(`Snap ${i}: ${Math.round(snapDist)}m > ${Math.round(threshold)}m`);
                            toRemove.add(i);
                        }
                    }

                    if (toRemove.size === 0) {
                        displayRoute(routeCoords, route.distance, route.duration);
                        return;
                    }

                    // pts und fixedSet nach Entfernen neu indizieren
                    const newPts = [];
                    const newFixed = new Set();
                    let newIdx = 0;
                    for (let i = 0; i < pts.length; i++) {
                        if (!toRemove.has(i)) {
                            if (fixedSet.has(i)) newFixed.add(newIdx);
                            newPts.push(pts[i]);
                            newIdx++;
                        }
                    }
                    pts = newPts;
                    fixedSet = newFixed;
                }

                // Letzter Versuch mit bereinigten Punkten
                const coords = pts.map(p => `${p.lng.toFixed(6)},${p.lat.toFixed(6)}`).join(';');
                const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`);
                const data = await res.json();
                if (data.code !== 'Ok') { setStatus(`❌ ${data.code}`); return; }
                const routeCoords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                displayRoute(routeCoords, data.routes[0].distance, data.routes[0].duration);

            } catch (err) {
                console.error('Route-Fehler:', err);
                setStatus('❌ Netzwerkfehler – Internetverbindung prüfen.');
            }
        }

        // ---- Kürzeste Route durch Fixpunkte (TSP) ----
        async function routeShortestThroughPins() {
            if (fixedWaypoints.length < 2) {
                setStatus('Mindestens 2 Fixpunkte nötig.');
                return;
            }
            setStatus('⏳ Kürzeste Reihenfolge wird berechnet…');

            const optimized = optimizeWaypointOrder([...fixedWaypoints]);
            fixedWaypoints = optimized;
            refreshPinNumbers();

            if (drawnPoints.length >= 2) {
                // Mit gezeichneter Route: Linie als Orientierung behalten, Fixpunkte in optimierter Reihenfolge
                await tryRouteEndpointOrdered(optimized);
            } else {
                // Ohne gezeichnete Route: direkt durch Fixpunkte routen
                const coords = optimized.map(wp => `${wp.latlng.lng.toFixed(6)},${wp.latlng.lat.toFixed(6)}`).join(';');
                try {
                    const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`);
                    const data = await res.json();
                    if (data.code !== 'Ok') { setStatus(`❌ Fehler: ${data.code}`); return; }
                    const routeCoords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                    if (matchedPolyline) { map.removeLayer(matchedPolyline); matchedPolyline = null; }
                    matchedPolyline = L.polyline(routeCoords, { color: '#34C759', weight: 5, opacity: 0.9 }).addTo(map);
                    const km = (data.routes[0].distance / 1000).toFixed(1);
                    const min = Math.round(data.routes[0].duration / 60);
                    setStatus(`✅ ${km} km  |  ca. ${min} Min.  · ${fixedWaypoints.length} Fixpunkte (optimiert)`);
                    saveFixedWaypoints();
                } catch (err) {
                    setStatus('❌ Netzwerkfehler – Internetverbindung prüfen.');
                }
            }
        }

        // Route entlang der gezeichneten Linie, Fixpunkte in gegebener Reihenfolge
        async function tryRouteEndpointOrdered(orderedFPs) {
            // Projektion jedes Fixpunkts auf die gezeichnete Linie (Index des nächsten drawnPoint)
            function projectOnLine(latlng) {
                let minDist = Infinity, bestIdx = 0;
                for (let i = 0; i < drawnPoints.length; i++) {
                    const d = haversine(latlng, drawnPoints[i]);
                    if (d < minDist) { minDist = d; bestIdx = i; }
                }
                return bestIdx;
            }

            const projections = orderedFPs.map(fp => projectOnLine(fp.latlng));

            // Wegpunkte aufbauen: Anfang der Zeichnung → fp[0] → Führungspunkte → fp[1] → ... → Ende
            const pts = [];

            // Gezeichnete Punkte vom Start bis zum ersten Fixpunkt
            const startSlice = drawnPoints.slice(0, projections[0]);
            samplePointsByDistance(startSlice.length > 1 ? startSlice : [], 300)
                .forEach(p => pts.push(p));

            for (let i = 0; i < orderedFPs.length; i++) {
                pts.push(orderedFPs[i].latlng);

                if (i < orderedFPs.length - 1) {
                    // Führungspunkte aus der Zeichnung zwischen diesem und dem nächsten Fixpunkt
                    const a = projections[i], b = projections[i + 1];
                    const segment = drawnPoints.slice(Math.min(a, b), Math.max(a, b) + 1);
                    if (segment.length > 2) {
                        // Maximal 3 Zwischenpunkte als Straßenführung
                        samplePoints(segment, Math.min(5, segment.length))
                            .slice(1, -1)
                            .forEach(p => pts.push(p));
                    }
                }
            }

            // Gezeichnete Punkte vom letzten Fixpunkt bis zum Ende
            const endSlice = drawnPoints.slice(projections[projections.length - 1] + 1);
            samplePointsByDistance(endSlice.length > 1 ? endSlice : [], 300)
                .forEach(p => pts.push(p));

            if (pts.length < 2) { setStatus('❌ Zu wenige Punkte.'); return; }

            try {
                const coords = pts.map(p => `${p.lng.toFixed(6)},${p.lat.toFixed(6)}`).join(';');
                const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`);
                const data = await res.json();
                if (data.code !== 'Ok') { setStatus(`❌ Fehler: ${data.code}`); return; }
                const routeCoords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                if (matchedPolyline) { map.removeLayer(matchedPolyline); matchedPolyline = null; }
                matchedPolyline = L.polyline(routeCoords, { color: '#34C759', weight: 5, opacity: 0.9 }).addTo(map);
                const km = (data.routes[0].distance / 1000).toFixed(1);
                const min = Math.round(data.routes[0].duration / 60);
                setStatus(`✅ ${km} km  |  ca. ${min} Min.  · ${orderedFPs.length} Fixpunkte (optimiert)`);
                saveDrawnPoints();
                saveFixedWaypoints();
            } catch (err) {
                setStatus('❌ Netzwerkfehler – Internetverbindung prüfen.');
            }
        }

        function optimizeWaypointOrder(wps) {
            if (wps.length <= 1) return wps;
            // Nearest Neighbor von jedem möglichen Startpunkt, bestes Ergebnis behalten
            let best = null, bestDist = Infinity;
            for (let start = 0; start < wps.length; start++) {
                const route = nearestNeighbor(wps, start);
                const d = totalDistanceFp(route);
                if (d < bestDist) { bestDist = d; best = route; }
            }
            return twoOpt(best);
        }

        function nearestNeighbor(wps, startIdx) {
            const unvisited = [...wps];
            const result = [unvisited.splice(startIdx, 1)[0]];
            while (unvisited.length > 0) {
                const last = result[result.length - 1];
                let minDist = Infinity, bestIdx = 0;
                for (let i = 0; i < unvisited.length; i++) {
                    const d = haversine(last.latlng, unvisited[i].latlng);
                    if (d < minDist) { minDist = d; bestIdx = i; }
                }
                result.push(unvisited.splice(bestIdx, 1)[0]);
            }
            return result;
        }

        function twoOpt(wps) {
            let route = [...wps];
            let improved = true;
            while (improved) {
                improved = false;
                for (let i = 0; i < route.length - 1; i++) {
                    for (let j = i + 2; j < route.length; j++) {
                        // Kosten der aktuellen Verbindung vs. nach dem Swap
                        const before = haversine(route[i].latlng, route[i + 1].latlng)
                                     + (j + 1 < route.length ? haversine(route[j].latlng, route[j + 1].latlng) : 0);
                        const after  = haversine(route[i].latlng, route[j].latlng)
                                     + (j + 1 < route.length ? haversine(route[i + 1].latlng, route[j + 1].latlng) : 0);
                        if (after < before - 1) {
                            route = [...route.slice(0, i + 1), ...route.slice(i + 1, j + 1).reverse(), ...route.slice(j + 1)];
                            improved = true;
                            break;
                        }
                    }
                    if (improved) break;
                }
            }
            return route;
        }

        function totalDistanceFp(wps) {
            let d = 0;
            for (let i = 1; i < wps.length; i++) d += haversine(wps[i - 1].latlng, wps[i].latlng);
            return d;
        }

        function samplePointsByDistance(points, minDist) {
            if (points.length < 2) return [...points];
            const result = [points[0]];
            for (let i = 1; i < points.length - 1; i++) {
                if (haversine(result[result.length - 1], points[i]) >= minDist) {
                    result.push(points[i]);
                }
            }
            result.push(points[points.length - 1]);
            return result;
        }

        function distToDrawnLine(lat, lng) {
            let minDist = Infinity;
            const cosLat = Math.cos(lat * Math.PI / 180);
            for (let i = 0; i < drawnPoints.length; i += 3) {
                const dp = drawnPoints[i];
                const dlat = (lat - dp.lat) * 111320;
                const dlng = (lng - dp.lng) * 111320 * cosLat;
                const d = Math.sqrt(dlat * dlat + dlng * dlng);
                if (d < minDist) minDist = d;
            }
            return minDist;
        }

        function haversine(a, b) {
            const R = 6371000;
            const lat1 = a.lat * Math.PI / 180, lat2 = b.lat * Math.PI / 180;
            const dlat = lat2 - lat1;
            const dlng = (b.lng - a.lng) * Math.PI / 180;
            const s = Math.sin(dlat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dlng / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
        }

        function displayRoute(latLngs, distance, duration) {
            if (matchedPolyline) { map.removeLayer(matchedPolyline); matchedPolyline = null; }
            matchedPolyline = L.polyline(latLngs, { color: '#34C759', weight: 5, opacity: 0.9 }).addTo(map);
            const km = (distance / 1000).toFixed(1);
            const min = Math.round(duration / 60);
            const fpInfo = fixedWaypoints.length > 0 ? `  · ${fixedWaypoints.length} Fixpunkt${fixedWaypoints.length > 1 ? 'e' : ''}` : '';
            setStatus(`✅ ${km} km  |  ca. ${min} Min.${fpInfo}`);
            saveDrawnPoints();
            saveFixedWaypoints();
        }

        function findUturns(coords, windowSize = 10, threshold = 160) {
            const uturns = [];
            for (let i = windowSize; i < coords.length - windowSize; i++) {
                const b1 = getBearing(coords[i - windowSize], coords[i]);
                const b2 = getBearing(coords[i], coords[i + windowSize]);
                if (angleDiff(b1, b2) > threshold) {
                    uturns.push(i);
                    i += windowSize;
                }
            }
            return uturns;
        }

        function getBearing(a, b) {
            const lat1 = a[0] * Math.PI / 180, lat2 = b[0] * Math.PI / 180;
            const dLon = (b[1] - a[1]) * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2);
            const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        function angleDiff(a, b) {
            const d = Math.abs(a - b) % 360;
            return d > 180 ? 360 - d : d;
        }

        function samplePoints(points, maxCount) {
            if (points.length <= maxCount) return [...points];
            const result = [];
            const step = (points.length - 1) / (maxCount - 1);
            for (let i = 0; i < maxCount; i++) {
                result.push(points[Math.round(i * step)]);
            }
            return result;
        }
    </script>
